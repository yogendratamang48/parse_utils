# Publishes to PyPI when a version tag (e.g. v2.0.0) is pushed.
# Requires a trusted publisher configured on PyPI for this repo/workflow:
# https://docs.pypi.org/trusted-publishers/
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
